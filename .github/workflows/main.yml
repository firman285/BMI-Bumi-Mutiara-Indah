name: Build BMI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir project
          unzip -q BMI-Bumi-Mutiara-Indah-V3-Firebase.zip -d project

      - name: Find project
        run: |
          find project -name gradlew -type f

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find project -name gradlew -type f | head -1)")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BMI-APK
          path: project/**/build/outputs/apk/**/*.apk
